<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Văn hóa Nghệ Hà | Trang chủ</title>
    <link rel="icon" type="image/png" href="./img/logo/logo-favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <!-- <link rel="stylesheet" href="../css/style.min.css"> -->
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/custom.css">
    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <link rel="stylesheet" href="./css/utility.css">
    <link rel="stylesheet" href="./css/swiper-custom.css">
    <link rel="stylesheet" href="./css/effect-web.css">
</head>

<body>
    <header class="flex center-ver bg-white" id="header" data-include="./component/header.html"></header>
    <main>
        <section class="sec-hero bg-white-secondary">
            <div class="container-l  sec-hero__container  container-padding ">
                <div class="sec-hero__content flex-1 flex gap-20 border-radius-15 overflow-hidden center-ver">
                    <div class="sec-hero__info flex flex-col gap-20">
                        <div class="sec-hero__badge flex flex-col gap-5">
                            <span class="uppercase text-xs bold text-color-primary">• NHÀ VĂN - NHÀ THƠ - TRUYỆN
                                KÝ</span>
                            <h1 class="text-header-size bold text-black">Dương Thanh Biểu</h1>
                            <span class="italic text-sm text-color-deactive">BÚT DANH: NGHỆ HÀ</span>
                        </div>

                        <blockquote class="sec-hero__quote item-padding-20 bg-white border-radius-5">
                            <p class="italic text-md">"Văn chương là cầu nối giữa tâm hồn con người với con người, giữa
                                quá khứ và hiện tại, giữa đau thương và hy vọng."</p>
                        </blockquote>

                        <div class="sec-hero__actions flex gap-15 flex-wrap">
                            <a href="javascript:void(0)"
                                class="btn-primary active item-padding-10-20 border-radius-5">TÁC
                                GIẢ NGHỆ HÀ</a>
                            <a href="javascript:void(0)" class="btn-primary item-padding-10-20 border-radius-5">NGHỆ
                                THUẬT & VĂN HỌC</a>
                        </div>
                    </div>

                    <div class="sec-hero__thumb pos-rel overflow-hidden ratio-1x1">
                        <img src="./img/content/left-content.svg" alt="Nhà văn Dương Thanh Biểu"
                            class="img-content fill-view fill-height">
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer class="bg-white-secondary" id="footer" data-include="./component/footer.html"></footer>
    <div class="btntotop__container pos-fixed bg-white" data-include="./component/rolltotop.html" id="btnToTop">
    </div>
    <script defer type="text/javascript" src="https://code.jquery.com/jquery-1.11.0.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script defer type="text/javascript" src="./js/frontend.js"></script>
</body>

</html>
